<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CardForge</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header>
    <h1>CardForge</h1>
    <p>Raw data → editable cards</p>
  </header>

  <section class="controls">
    <input id="folderPath" placeholder="/absolute/folder/path"/>
    <button id="ingestBtn">Ingest Folder</button>
    <button id="refreshBtn">Refresh</button>
  </section>

  <section id="status"></section>
  <main id="deck" class="deck"></main>

  <template id="cardTpl">
    <article class="card">
      <div class="type"></div>
      <input class="title"/>
      <input class="subtitle"/>
      <textarea class="description"></textarea>
      <details>
        <summary>Fields</summary>
        <textarea class="fields"></textarea>
      </details>
      <details>
        <summary>Source Provenance</summary>
        <pre class="source"></pre>
      </details>
      <div class="actions">
        <button class="save">Save</button>
        <button class="revs">Revisions</button>
      </div>
      <div class="revpanel"></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
